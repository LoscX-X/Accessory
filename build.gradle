plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '9.3.0'
}

group = 'com.cendreal.accessory'
version = '6.0.0'
apply from: 'gradle/paper-sdk.gradle'

allprojects {
    apply plugin: 'java-library'
    group = rootProject.group
    version = rootProject.version
    repositories {
        mavenCentral()
        maven { url = uri('https://repo.aurelium.dev/releases'); content { includeGroup 'dev.aurelium' } }
        maven { url = uri('https://repo.extendedclip.com/releases/'); content { includeGroup 'me.clip' } }
        maven { url = uri('https://mvn.lumine.io/repository/maven-public/'); content { includeGroup 'io.lumine' } }
    }
    java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
    tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
    dependencies {
        compileOnly rootProject.paperSdk
        compileOnly 'org.jetbrains:annotations:26.0.2'
    }
}

dependencies { implementation project(':paper') }
processResources {
    inputs.property('version', project.version)
    filesMatching('paper-plugin.yml') { expand(version: project.version) }
}
jar { archiveClassifier = 'plain' }
shadowJar {
    archiveFileName = 'accessory+.jar'
    relocate 'com.zaxxer.hikari', 'com.cendreal.accessory.lib.hikari'
    relocate 'redis.clients.jedis', 'com.cendreal.accessory.lib.jedis'
    relocate 'org.slf4j', 'com.cendreal.accessory.lib.slf4j'
    relocate 'com.mysql', 'com.cendreal.accessory.lib.mysql'
    relocate 'org.apache.commons.pool2', 'com.cendreal.accessory.lib.pool2'
    relocate 'org.json', 'com.cendreal.accessory.lib.json'
    relocate 'com.google.gson', 'com.cendreal.accessory.lib.gson'
    relocate 'com.google.errorprone', 'com.cendreal.accessory.lib.errorprone'
    relocate 'com.google.protobuf', 'com.cendreal.accessory.lib.protobuf'
    filesMatching('META-INF/services/**') { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
    mergeServiceFiles()
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}
tasks.register('releaseJar', Copy) {
    group = 'build'
    description = 'Copies the installable accessory+ plugin to dist/26.3.'
    from(shadowJar.archiveFile)
    into(layout.projectDirectory.dir('dist/26.3'))
}
build.dependsOn 'releaseJar'
