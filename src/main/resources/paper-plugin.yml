name: accessoryplus
prefix: 'accessory+'
version: '${version}'
main: com.cendreal.accessory.paper.AccessoryPlus
api-version: '26.3'
folia-supported: true
authors: ['LoscX']
dependencies:
  server:
    AuraSkills:
      load: BEFORE
      required: false
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    MythicMobs:
      load: BEFORE
      required: false
      join-classpath: true
    AttributePlus:
      load: BEFORE
      required: false
      join-classpath: true
permissions:
  accessory.reload:
    description: Allow reloading accessory+
    default: op
  accessory.clear:
    description: Allow clearing player accessories
    default: op
  accessory.view:
    description: Allow read-only viewing of another player's accessory inventory
    default: op
  accessory.shield:
    description: Allow adjusting physical shield
    default: op
  accessory.magicshield:
    description: Allow adjusting magic shield
    default: op
  accessory.admin:
    default: op
    children:
      accessory.reload: true
      accessory.clear: true
      accessory.view: true
      accessory.shield: true
      accessory.magicshield: true
  cendreal.accessory.admin:
    default: op
    children:
      accessory.admin: true

provides: [Accessory]
