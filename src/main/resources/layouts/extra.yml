# 遗物 · 两行各六格，接受带 [Relics] 标签的饰品。
size: 36
title: '<#FFE476><bold>遗物</bold> <gray>{page}/{max_page}'

slots:
  # 背包第二行
  "10":
    lore: ['[Relics]']
  "11":
    lore: ['[Relics]']
  "12":
    lore: ['[Relics]']
  "14":
    lore: ['[Relics]']
  "15":
    lore: ['[Relics]']
  "16":
    lore: ['[Relics]']

  # 背包第三行
  "19":
    lore: ['[Relics]']
  "20":
    lore: ['[Relics]']
  "21":
    lore: ['[Relics]']
  "23":
    lore: ['[Relics]']
  "24":
    lore: ['[Relics]']
  "25":
    lore: ['[Relics]']

# 槽位禁用时显示的物品
disabled-slot:
  item:
    type: RED_STAINED_GLASS_PANE
    name: '<red>槽位已禁用'
    lore:
      - '<gray>此槽位当前不可使用'

# 页面装饰与翻页按钮
frame:
  border:
    # 每行对应背包的一行。
    slots: [
      0, 1, 2, 3, 5, 6, 7, 8,
      9, 13, 17,
      18, 22, 26,
      28, 29, 30, 31, 32, 33, 34, 35
    ]
    type: BLACK_STAINED_GLASS_PANE
    hide-tooltip: true

  help:
    slots: [4]
    type: NETHER_STAR
    name: '<#FFE476>遗物 · 12 格'
    lore:
      - '<gray>每格仅接受带有 [Relics] 的遗物'

  previous:
    slots: [27]
    type: ARROW
    name: '<yellow>← 牌组'
    lore:
      - '<gray>返回 5 格牌组页'
    action: previous_page
