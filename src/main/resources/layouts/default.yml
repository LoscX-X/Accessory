# 牌组 · 每个花色一格，底部中央可放任意花色。
size: 27
title: '<#76C5E2><bold>牌组</bold> <gray>{page}/{max_page}'

# 装备条件。槽号从 0 开始，同一槽位的 Lore 匹配任意一项即可。
slots:
  "10":
    lore: ['[♠]']
  "12":
    lore: ['[♣]']
  "14":
    lore: ['[❤]']
  "16":
    lore: ['[♦]']
  "22":
    lore: ['[♠]', '[♣]', '[❤]', '[♦]']

# 槽位禁用时显示的物品
disabled-slot:
  item:
    type: RED_STAINED_GLASS_PANE
    name: '<red>槽位已禁用'
    lore:
      - '<gray>此槽位当前不可使用'

# 页面装饰与翻页按钮
frame:
  border:
    # 每行对应背包的一行。
    slots: [
      0, 2, 6, 8,
      9, 11, 13, 15, 17,
      18, 19, 20, 21, 23, 24, 25
    ]
    type: BLACK_STAINED_GLASS_PANE
    hide-tooltip: true

  spade:
    slots: [1]
    type: LIGHT_BLUE_STAINED_GLASS_PANE
    name: '<#76C5E2>♠ 黑桃'
    lore:
      - '<gray>下方槽位仅接受黑桃牌组'

  club:
    slots: [3]
    type: LIME_STAINED_GLASS_PANE
    name: '<#DFFB9D>♣ 梅花'
    lore:
      - '<gray>下方槽位仅接受梅花牌组'

  heart:
    slots: [5]
    type: PINK_STAINED_GLASS_PANE
    name: '<#F4A6BB>❤ 红桃'
    lore:
      - '<gray>下方槽位仅接受红桃牌组'

  diamond:
    slots: [7]
    type: ORANGE_STAINED_GLASS_PANE
    name: '<#F4BF75>♦ 方块'
    lore:
      - '<gray>下方槽位仅接受方块牌组'

  help:
    slots: [4]
    type: BOOK
    name: '<gold>牌组 · 5 格'
    lore:
      - '<gray>四个花色各有一个专属槽位'
      - '<gray>底部中央为任意花色槽位'
      - '<gray>任意花色槽位仅接受牌组'

  next:
    slots: [26]
    type: ARROW
    name: '<yellow>遗物 →'
    lore:
      - '<gray>前往 12 格遗物页'
    action: next_page
